services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrprint
      POSTGRES_PASSWORD: qrprint
      POSTGRES_DB: qr_print
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - qr-print-db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
volumes:
  qr-print-db:
